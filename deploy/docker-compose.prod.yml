# Production stack for the EC2 (t4g.small / arm64) host — one 2 GB box shared by all three services.
#
#   frontend (nginx)      — the only service published to the host (port 80 → public IP).
#   backend  (Spring Boot) — internal only; reachable by nginx over the compose network, never
#                            published to the host, so /actuator is not exposed to the internet.
#   mysql    (MySQL 8)     — self-hosted on this same host (ADR 0006, which supersedes the RDS
#                            choice in ADR 0005). Internal to the compose network with NO host port
#                            mapping, so the database is unreachable from the internet. Data lives
#                            in a named volume; if that volume is destroyed, Flyway + demo seeding
#                            rebuild it on the next backend boot.
#
# Memory budget (see ADR 0006): explicit per-service mem_limit + a JVM heap cap + a tuned MySQL
# footprint keep steady state around ~1.3 GB (384 + 768 + 128), leaving headroom on the 2 GB host.
# A host swapfile (see docs/deploy/aws-setup.md) is the OOM safety net for transient spikes.
#
# Images are pulled from ECR. All secrets/config come from a host-only .env (see .env.example);
# nothing sensitive is committed. Run from this directory:
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # Small footprint so MySQL fits alongside the JVM in 2 GB: a 128M buffer pool is ample for
    # demo-sized data, performance_schema off frees memory, and a modest connection cap bounds it.
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    environment:
      MYSQL_DATABASE: bookinn
      # App credentials come from the same .env vars the backend uses, so there is a single source
      # of truth: the container creates this user, the backend connects with it.
      MYSQL_USER: ${BOOKINN_DB_USERNAME}
      MYSQL_PASSWORD: ${BOOKINN_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # No `ports:` — internal to the compose network only, unreachable from the host or the internet.
    volumes:
      - bookinn-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
      # First boot initialises the data dir + warms the buffer pool before it reports healthy.
      start_period: 40s
    mem_limit: 384m

  backend:
    image: ${ECR_REGISTRY}/bookinn/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Wait for MySQL to be healthy before starting, so Flyway/seeding runs against a ready DB and
    # the two boot-time memory spikes (buffer-pool warmup vs Flyway+seeding) do not overlap.
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      BOOKINN_DB_URL: ${BOOKINN_DB_URL}
      BOOKINN_DB_USERNAME: ${BOOKINN_DB_USERNAME}
      BOOKINN_DB_PASSWORD: ${BOOKINN_DB_PASSWORD}
      BOOKINN_JWT_SECRET: ${BOOKINN_JWT_SECRET}
      # Explicit heap cap — overrides the image's MaxRAMPercentage=75%, which was written for the
      # RDS-era single-tenant box and is unsafe now MySQL shares the host. 512m heap + JVM overhead
      # stays inside the 768m mem_limit below.
      JAVA_OPTS: "-Xmx512m -Xss512k"
    # Internal to the compose network only — no host port mapping.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Generous grace period: JVM boot + Flyway migrations + demo seeding on first start.
      start_period: 90s
    mem_limit: 768m

  frontend:
    image: ${ECR_REGISTRY}/bookinn/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    mem_limit: 128m

volumes:
  bookinn-mysql-data:
