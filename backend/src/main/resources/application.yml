spring:
  application:
    name: bookinn-backend
  datasource:
    url: jdbc:mysql://localhost:3306/bookinn
    username: bookinn
    password: bookinn
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Expose only the health probe (used by the container healthcheck), nothing else. Never proxied
# publicly by nginx, so metrics/env/etc. stay off the wire entirely.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

bookinn:
  jwt:
    # Overridden by BOOKINN_JWT_SECRET in deployed environments (see M7). Must be >= 32 bytes for HS256.
    secret: ${BOOKINN_JWT_SECRET:bookinn-local-dev-secret-key-change-me-please-0123456789abcdef}
    access-ttl: 15m
    refresh-ttl: 7d
  auth:
    refresh-cookie-name: refresh_token
    # false for local http dev; set true behind HTTPS.
    cookie-secure: false
