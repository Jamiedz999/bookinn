# nginx serves the React SPA and is the single public entrypoint (port 80).
# /api/* is reverse-proxied to the backend container over the compose network; everything else is a
# static asset with an index.html fallback for client-side routing. /actuator is deliberately NOT
# proxied, so it never reaches the public internet.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend service (compose DNS name "backend"). No path rewrite: the backend
    # already maps everything under /api, matching the Vite dev proxy.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths return index.html so React Router can handle the route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
