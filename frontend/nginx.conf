# nginx serves the React SPA and is the single public entrypoint (port 80).
# Backend routes are reverse-proxied to the backend container over the compose network; everything
# else is a static asset with an index.html fallback for client-side routing. /actuator is
# deliberately NOT proxied, so it never reaches the public internet.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Shared proxy headers, inherited by every backend location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # App API. No path rewrite: the backend already maps everything under /api, matching the Vite
    # dev proxy.
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Swagger UI + OpenAPI JSON stay public (demo feature). They live outside /api, so proxy them
    # explicitly or the SPA fallback below would swallow them. /actuator is intentionally absent here.
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
    }
    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    # SPA fallback: unknown paths return index.html so React Router can handle the route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
