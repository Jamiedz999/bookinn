# PR gate. Runs on every pull request and on pushes to master (so the badge reflects master's
# health). Two independent jobs run in parallel — a backend failure and a frontend failure surface
# separately. The Deploy workflow keys off this workflow's success on master, so a red run here
# blocks production.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Supersede in-flight runs for the same branch/PR — no point finishing a run for an outdated commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` runs the full gate: Checkstyle + SpotBugs + unit tests + Testcontainers integration
      # tests + the JaCoCo 90% line-coverage check (all bound in pom.xml). The ubuntu runner ships a
      # working Docker daemon, which Testcontainers needs for the real MySQL container.
      - name: Build, test & quality gates
        run: ./mvnw -B --no-transfer-progress verify

  frontend:
    name: Frontend (lint + coverage + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # --coverage activates the thresholds in vite.config.ts (API layer 100%), so a drop fails here.
      - name: Test with coverage
        run: npm run test -- --coverage

      - name: Build
        run: npm run build
